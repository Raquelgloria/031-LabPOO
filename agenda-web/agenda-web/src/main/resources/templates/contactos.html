<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agenda de Contactos</title>
</head>
<body>
    <h1>Agenda de Contactos</h1>
    <a href="/nuevo">Agregar contacto</a>

    <p th:if="${#lists.isEmpty(contactos)}">No hay contactos en la agenda.</p>

    <table th:unless="${#lists.isEmpty(contactos)}">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="contacto : ${contactos}">
                <td th:text="${contacto.nombre}"></td>
                <td th:text="${contacto.apellido}"></td>
                <td th:text="${contacto.email}"></td>
                <td th:text="${contacto.telefono}"></td>
                <td>
                    <a th:href="@{/editar/{id}(id=${contacto.id})}">Editar</a>
                    <form th:action="@{/eliminar/{id}(id=${contacto.id})}" method="post" style="display: inline;">
                        <button type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
