<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de vehículo - AUTO RUN</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172554;
            margin: 0;
            padding: 30px;
        }

        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 25px;
            background: white;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button, .back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            border: 0;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>Registrar o editar vehículo</h1>
        <form th:action="@{/vehiculos/guardar}" th:object="${vehiculo}" method="post">
            <input type="hidden" th:field="*{id}">

            <label for="marca">Marca</label>
            <input id="marca" type="text" th:field="*{marca}" required>

            <label for="modelo">Modelo</label>
            <input id="modelo" type="text" th:field="*{modelo}" required>

            <label for="anio">Año</label>
            <input id="anio" type="number" th:field="*{anio}" min="1886" required>

            <label for="color">Color</label>
            <input id="color" type="text" th:field="*{color}">

            <label for="precio">Precio</label>
            <input id="precio" type="number" th:field="*{precio}" min="0" step="0.01" required>

            <label for="kilometraje">Kilometraje</label>
            <input id="kilometraje" type="number" th:field="*{kilometraje}" min="0" required>

            <label for="estado">Estado</label>
            <input id="estado" type="text" th:field="*{estado}" required>

            <button type="submit">Guardar</button>
            <a class="back" th:href="@{/vehiculos}">Cancelar</a>
        </form>
    </main>
</body>
</html>
